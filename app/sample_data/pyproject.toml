[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smdx-sample"
version = "0.1.0"
description = "スーパーマーケットDX 研究用サンプルデータ生成(F-20)"
requires-python = ">=3.11,<3.12"
# 版は app/constraints.txt で固定する
dependencies = ["numpy", "pandas", "tzdata"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["smdx_sample*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
